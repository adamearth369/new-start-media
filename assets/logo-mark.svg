<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 340"
     role="img"
     aria-labelledby="title">
  <title id="title">New Start Media mark</title>

  <defs>
    <linearGradient id="champagneLeft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#B98C70"/>
      <stop offset="100%" stop-color="#D7B49A"/>
    </linearGradient>

    <linearGradient id="champagneRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C3AA"/>
      <stop offset="100%" stop-color="#B78A6B"/>
    </linearGradient>
  </defs>

  <!-- LEFT ASCENT -->
  <path
    d="M45 280
       L210 40
       L210 105
       L45 280
       Z"
    fill="url(#champagneLeft)"
  />

  <!-- RIGHT ASCENT -->
  <path
    d="M210 40
       L375 280
       L210 105
       Z"
    fill="url(#champagneRight)"
  />

  <!-- HORIZON -->
  <line
    x1="78"
    y1="280"
    x2="342"
    y2="280"
    stroke="#C99F84"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- CENTER POINT -->
  <circle
    cx="210"
    cy="280"
    r="11"
    fill="#C99F84"
  />
</svg>
